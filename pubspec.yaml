name: mob_driver
description: "MOB Driver, the delivery partner app: duty, trips, proof of delivery and earnings."
publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  just_audio: ^0.10.5
  equatable: ^3.0.0
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  firebase_crashlytics: ^5.2.4
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^22.3.1
  go_router: ^18.0.2
  intl: ^0.20.2
  lottie: ^3.3.3
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  dio: ^5.7.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^11.2.0
  google_maps_flutter: ^2.5.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.2
  sentry_flutter: ^9.30.1
  sentry_dio: ^9.30.1
  qr_flutter: ^4.1.0
  google_maps_flutter_android: ^2.21.0
  google_maps_flutter_platform_interface: ^2.17.0
  share_plus: ^13.3.1
  vibration: ^3.2.1
  flutter_image_compress: ^2.5.1

dev_dependencies:
  image: ^4.8.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
    - assets/icons/toast/
    - assets/images/
    - assets/images/vehicles/
    - assets/sounds/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
